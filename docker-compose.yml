x-db-env: &db-env
  POSTGRES_HOST: postgis
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: safestreet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safestreet_net

  pipeline:
    build: .
    container_name: safestreet-pipeline
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      <<: *db-env
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "src.pipeline_etl", "--city", "sao-paulo"]
    networks:
      - safestreet_net

  dashboard:
    build: .
    container_name: safestreet-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      <<: *db-env
    command: ["streamlit", "run", "src/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    volumes:
      - ./data:/app/data
    networks:
      - safestreet_net

  api:
    build: .
    container_name: safestreet-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      <<: *db-env
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/app/data
    networks:
      - safestreet_net

  scheduler:
    build: .
    container_name: safestreet-scheduler
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      <<: *db-env
    command: >
      sh -c "while true; do
        echo '[$(date)] Running incremental pipeline...';
        python -m src.pipeline_etl --city sao-paulo --incremental;
        echo '[$(date)] Pipeline done. Sleeping 6h...';
        sleep 21600;
      done"
    volumes:
      - ./data:/app/data
    networks:
      - safestreet_net

volumes:
  postgis_data:

networks:
  safestreet_net:
    driver: bridge
